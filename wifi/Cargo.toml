[package]
name = "wifi"
version = "0.1.0"
edition = "2024"

[dependencies]
# esp-idf-svc = "0.51"
heapless = "0.8.0"
log = "0.4.29"
global_settings = { path = "../global_settings" }
embassy-net = { version = "0.9.1", features = ["alloc", "dhcpv4", "dns", "tcp", "udp"] }
esp-hal = { version = "1.1.1", features = ["esp32s3"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi"] }
static_cell = { version = "2.1.1", features = ["nightly"] }
embassy-futures = "0.1.2"
embassy-executor = "0.10.0"
reqwless = { version = "0.14.0", default-features = false, features = ["alloc", "log"] }
embedded-io-async = "0.7.0"
anyhow = { version = "1.0.104", default-features = false }
