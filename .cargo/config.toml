[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.3.3"
DEP_LV_CONFIG_PATH = { relative = true, value = "lvgl-configs" }
CROSS_COMPILE = "xtensa-esp32s3-elf"
CFLAGS_xtensa_esp32s3_espidf="-mlongcalls"
LVGL_FONTS_DIR = {relative = true, value = "fonts"}
TARGET_C_INCLUDE_PATH = "/home/tortus/.rustup/toolchains/esp/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/xtensa-esp-elf/include"
