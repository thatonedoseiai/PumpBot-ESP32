[package]
name = "menus"
version = "0.1.0"
edition = "2024"

[features]
sim = []

[dependencies]
anyhow = { version = "1.0.102", default-features = false }
fontfile = { path = "../fontfile" }
log = "0.4.29"
global_settings = { path = "../global_settings" }
embedded-graphics = "0.8.2"
display-interface-spi = "0.5.0"
embassy-sync = "0.8.0"
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
embedded-hal-bus = "0.3.0"
dummy-pin = "1.0.0"
embassy-time = "0.5.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi"] }
embassy-net = { version = "0.9.1", features = ["tcp", "alloc", "medium-ip", "proto-ipv4"] }
# embedded-graphics-simulator = "0.8.0"

[target.'cfg(not(feature = "sim"))'.dependencies]
# esp-idf-hal = "0.45.2"
ledc = { path = "../ledc" }
rotenc = { path = "../rotenc" }
pwm = { path = "../pwm" }
button_idf = { path = "../button_idf" }
ili9341 = "0.6.0"
st7735-lcd = { path = "../st7735-lcd-rs" }
# esp-idf-sys = "0.36.1"
profiler = { path = "../profiler" }
wifi = { path = "../wifi" }
socket = { path = "../socket" }

[target.'cfg(feature = "sim")'.dependencies]
embedded-graphics-simulator = "0.8.0"
